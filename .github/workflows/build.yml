name: Build
on:
  push:
    branches: [main, feat/v0.1.0-safety-kernel]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: nexora-sentinel-dist
          path: dist/*
