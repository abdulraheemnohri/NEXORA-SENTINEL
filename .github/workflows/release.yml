name: Manual Release Gate
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub release (requires explicit operator intent)"
        required: true
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch for release candidates
        run: |
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "Release candidates may only be built from main."
            exit 1
          }
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[dev]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Lint
        run: ruff check src tests
      - name: Full test suite
        run: pytest
      - name: Python compilation
        run: python -m compileall -q src
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: dist/*
      - name: Require explicit release approval
        if: ${{ inputs.publish_release != true }}
        run: echo "Release not published. Set publish_release=true only after human review."
      - name: Publish draft release
        if: ${{ inputs.publish_release == true }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.2.0-build-${{ github.run_number }}
          name: NEXORA Sentinel 0.2.0 build ${{ github.run_number }}
          draft: true
          files: dist/*
