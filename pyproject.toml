[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "nexora-sentinel"
version = "0.1.0"
description = "NEXORA Sentinel Self-Terminal Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
license = "Unlicense"
dependencies = ["cryptography>=42,<47"]
[project.scripts]
nexora = "nexora.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.data-files]
"share/nexora/spec" = ["spec/capability_catalog.json", "spec/meta_rules.json", "spec/interaction_matrix.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
