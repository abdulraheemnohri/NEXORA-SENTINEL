[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "nexora-sentinel"
version = "0.1.0"
description = "NEXORA Sentinel Self-Terminal Autonomous Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
license = "Unlicense"
dependencies = []
[project.scripts]
nexora = "nexora.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
