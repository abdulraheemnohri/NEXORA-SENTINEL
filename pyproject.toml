[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-sentinel"
version = "0.2.0"
description = "NEXORA Sentinel local-first safety and governance platform"
readme = "README.md"
requires-python = ">=3.11"
license = "Unlicense"
dependencies = ["cryptography>=42,<51", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
nexora = "nexora.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/nexora/spec" = ["spec/capability_catalog.json", "spec/meta_rules.json", "spec/interaction_matrix.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
